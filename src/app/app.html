<app-head-bar></app-head-bar>
<app-search-bar [autos]="autoList" (onSelectCar)="selectCar($event)"></app-search-bar>

@if (selectedCar) {
  <!-- J'ai ajouté cette condition pour afficher la vue détaillée de la voiture sélectionnée uniquement si une voiture est sélectionnée. -->
  <div class="overlay" (click)="closeCar()">
    <div class="car-details" (click)="$event.stopPropagation()">
      <button class="close-btn" (click)="closeCar()" aria-label="Fermer">&times;</button>
      <h2>{{ selectedCar.brand }} {{ selectedCar.model }}</h2>
      <img
        [src]="'images/' + selectedCar.photo"
        [alt]="selectedCar.brand + ' ' + selectedCar.model">
      <p>{{ selectedCar.description }}</p>
    </div>
  </div>
}
